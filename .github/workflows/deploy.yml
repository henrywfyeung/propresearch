name: Deploy

# Build both images, push to the shared Artifact Registry, migrate, then deploy.
#
# Replaces the Vercel pipeline. Keyless via Workload Identity Federation -- no
# service-account JSON key exists. Images are built in this runner and pushed
# straight to Artifact Registry, so CI needs no Cloud Build role and no
# project-wide storage permission (which would have let it reach fungi's
# buckets).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run should supersede, not race.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: fungi-family
  REGION: asia-southeast1
  REGISTRY: asia-southeast1-docker.pkg.dev
  REPO: apps
  INSTANCE: fungi-family:asia-southeast1:fungi-db
  DB_NAME: propsearch

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Required for the OIDC token that WIF exchanges.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # --- Build ---------------------------------------------------------
      # Both targets share the builder stage, so Next.js compiles once.

      - name: Build web image
        run: |
          docker build --target web \
            -t "$REGISTRY/$PROJECT_ID/$REPO/propsearch-web:${{ github.sha }}" \
            -t "$REGISTRY/$PROJECT_ID/$REPO/propsearch-web:latest" .

      - name: Build worker image
        run: |
          docker build --target worker \
            -t "$REGISTRY/$PROJECT_ID/$REPO/propsearch-worker:${{ github.sha }}" \
            -t "$REGISTRY/$PROJECT_ID/$REPO/propsearch-worker:latest" .

      - name: Push images
        run: |
          docker push --all-tags "$REGISTRY/$PROJECT_ID/$REPO/propsearch-web"
          docker push --all-tags "$REGISTRY/$PROJECT_ID/$REPO/propsearch-worker"

      # --- Migrate -------------------------------------------------------
      # Runs before deploy so a new revision never starts against an older
      # schema. The proxy gives a local socket with IAM auth, so no password
      # is involved.

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --auto-iam-authn --port 5432 "$INSTANCE" &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          # The IAM username is the CI service account minus the
          # .gserviceaccount.com suffix; the @ must be percent-encoded.
          DATABASE_URL: postgresql://propsearch-ci%40fungi-family.iam@127.0.0.1:5432/propsearch?sslmode=disable
        run: pnpm db:migrate

      - name: Grant runtime access to migrated tables
        env:
          DATABASE_URL: postgresql://propsearch-ci%40fungi-family.iam@127.0.0.1:5432/propsearch?sslmode=disable
        # Tables created by propsearch-ci are owned by that role and are
        # invisible to the runtime service accounts until granted. Without this
        # step a deploy succeeds and then every query fails with
        # "permission denied for table".
        run: pnpm db:grant

      # --- Deploy --------------------------------------------------------
      # Terraform owns each service's shape and ignores the image tag, so
      # updating the image here does not fight it.

      - name: Deploy web
        run: |
          gcloud run deploy propsearch-web \
            --image "$REGISTRY/$PROJECT_ID/$REPO/propsearch-web:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Deploy worker
        run: |
          gcloud run deploy propsearch-worker \
            --image "$REGISTRY/$PROJECT_ID/$REPO/propsearch-worker:${{ github.sha }}" \
            --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Smoke check
        run: |
          WEB=$(gcloud run services describe propsearch-web --region "$REGION" \
                  --project "$PROJECT_ID" --format='value(status.url)')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$WEB/login")
          echo "GET $WEB/login -> $CODE"
          test "$CODE" = "200"
