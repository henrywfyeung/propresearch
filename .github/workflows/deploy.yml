# Production CD — every push to main runs the test gate, then builds and deploys
# to Vercel via the CLI. Codified here (not the Vercel Git integration) so the
# whole pipeline lives in the repo.
#
# DORMANT UNTIL CONFIGURED: the `deploy` job is skipped (workflow stays green)
# until VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are set as repo secrets.
# So merging this file does not fail before Vercel setup is done. See docs/deploy.md.

name: Deploy (production)

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual redeploy from the Actions tab

# Never run two production deploys at once; don't cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Secrets can't be read in a job-level `if:`, so surface their presence as an
  # output. ready=false → the deploy job is skipped cleanly (no red X).
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
          O: ${{ secrets.VERCEL_ORG_ID }}
          P: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$O" ] && [ -n "$P" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (see docs/deploy.md)."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Defence-in-depth: a direct push to main (bypassing a PR) can't ship a
      # broken build. Mirrors ci.yml.
      - name: Lint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Cloud build (NOT --prebuilt): upload the source and let Vercel build it.
      # This is the only way NEXT_PUBLIC_* vars inline correctly — they're baked
      # in at build time, and Vercel injects the project's env vars into its own
      # build, whereas a local `vercel build` does not see them. The lint/
      # typecheck/test gate above is our build-correctness check; Vercel does the
      # production build. VERCEL_ORG_ID/VERCEL_PROJECT_ID (job env) target the project.
      - name: Deploy to production (Vercel cloud build)
        id: deploy
        run: |
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed → $url"
