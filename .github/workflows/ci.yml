name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs of the same workflow on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # No `version:` here — it's pinned in package.json's `packageManager`,
        # which the action picks up automatically. Specifying both errors out.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # No version ranges in package.json — CLAUDE.md §2.2 / [R9].
      # Any `^` or `~` in dependencies/devDependencies fails CI here.
      - name: Verify exact-pinned deps
        run: |
          if grep -E '"(dependencies|devDependencies)"' -A 200 package.json \
             | grep -E '^\s+"[^"]+":\s*"[\^~]' ; then
            echo "::error::package.json contains version ranges — pin exactly (no ^ or ~). See CLAUDE.md §2.2."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint + cross-row query guard
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
